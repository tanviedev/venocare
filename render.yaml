services:
  - type: web
    name: venocare
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn venocare.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: your-render-db-name
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"